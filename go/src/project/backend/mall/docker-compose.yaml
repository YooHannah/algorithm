version: '3.8'
services:

  mysql:
    image: mysql:8.0  # 使用8.0版本的 MySQL 镜像
    container_name: mysql  # 容器名称
    environment:
      MYSQL_ROOT_PASSWORD: 123456  # 设置 MySQL root 用户的密码
    ports:
      - "3306:3306"  # 将容器的 3306 端口映射到宿主机的 3306 端口
    volumes:
      - /Users/dockerMySql:/var/lib/mysql  # 将宿主机的 /usr/src/project/backend/mall/data/mysql 目录（需要提前创建,且在share file 范围内）挂载到容器的 /var/lib/mysql 目录
    restart: always  # 容器退出后总是重启

  redis:
    image: redis:8.6
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=123456
    volumes:
      - /Users/dockerRedis:/data
    restart: always
  etcd:
    image: bitnamilegacy/etcd:3.5.13
    container_name: etcd-server
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379   # 对外公告的地址
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379        # 关键修改：监听所有网络接口
    volumes:
      - etcd_data:/bitnami/etcd

  etcdkeeper:
    image: evildecay/etcdkeeper:latest
    container_name: etcd-ui
    ports:
      - "8080:8080"
    environment:
      - ETCD_SERVERS=http://etcd:2379  # 关键修改：使用etcd的服务名进行连接
    depends_on:
      - etcd

volumes:
  etcd_data:
    driver: local
